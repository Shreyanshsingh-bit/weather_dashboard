<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather_mood Dashboard</title>
</head>
<body>
    <div class="container">

        <h2>ENTER YOUR LOCATION DETAILS</h2>

        <form action="" class="location-form">
            <div class="input-area">
                <input type="text" id="country-input" placeholder="Enter country name" required />
            </div>

            <div class="input-area">
                <input type="text" id="state-input" placeholder="Enter state name" required />                
            </div>

            <div class="input-area">
                <input type="text" id="district-input" placeholder="Enter district name" required />
            </div>

            <div class="input-area">
                <input type="text" id="city-input" placeholder="Enter city name" required />
            </div>

            <button type="submit">Search</button>
            <!-- for displaying error when api request fails -->
            <p id="error-message" class="error-feedback hidden" aria-live="polite" role="status"></p>
        </form>
    </div>

    <div id="dynamic_cards"></div>

    <div id="live_feed">
        <h3>LIVE WEATHER STREAM</h3>

        <div id="feed-output">Waiting for data...</div>

        <!-- Adding type="button" is also good practice so they never accidentally trigger form submissions if placed near forms. -->
        <button id="start-feed" type="button">Start Feed</button>  
        <button id="stop-feed" type="button">Stop Feed</button>

    </div>
    <div id="modal" class="modal-backdrop hidden">
        <div class="modal-contents">
            <h3 id="modal-title">LOCATION DETAILS</h3>
            <p id="modal-body">Detailed forecast data will appear here.</p>
            <button id="close-modal" type="button">Close</button>
        </div>
    </div>
</body>
</html>
